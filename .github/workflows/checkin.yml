name: GLaDOS 2026 Checkin

on:
  workflow_dispatch:
    inputs:
      diagnose_only:
        description: 只检查 Cookie 是否可读取账号状态，不签到、不兑换、不推送
        required: false
        default: false
        type: boolean

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GLADOS_COOKIE: ${{ secrets.GLADOS_COOKIE }}
      GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
      CHECKIN_DIAGNOSTIC_ONLY: ${{ inputs.diagnose_only && 'true' || 'false' }}
      PUSH_LEVEL: ${{ vars.PUSH_LEVEL || 'all' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests
        run: python -m unittest discover -s tests -v

      - name: Run Checkin
        run: python checkin.py
        timeout-minutes: 5

      - name: Retry on Failure
        if: failure()
        run: |
          echo "First attempt failed, retrying in 60s..."
          sleep 60
          python checkin.py
        timeout-minutes: 5
